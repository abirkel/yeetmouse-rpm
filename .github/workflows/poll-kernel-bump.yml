name: Poll Fedora kernel version for kmod-yeetmouse

on:
  schedule:
    - cron: '30 */12 * * *'
  workflow_dispatch: {}

concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  COPR_OWNER: abirkel
  COPR_PROJECT: yeetmouse
  COPR_URL: https://copr.fedorainfracloud.org
  COPR_CHROOT: fedora-44-x86_64

jobs:
  poll:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install git and tooling
        run: dnf -y install git python3 curl findutils sed

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current stable kernel-devel NVR
        id: kernel
        run: |
          dnf -y makecache
          nvr=$(dnf repoquery --quiet --latest-limit=1 --qf '%{version}-%{release}.%{arch}' kernel-devel | tail -n1)
          if [ -z "$nvr" ]; then
            echo "::error::Could not resolve current kernel-devel NVR"
            exit 1
          fi
          # Validate format before trusting it anywhere downstream (commit message,
          # .external_versions, NVR substring match against built packages). Same
          # strict check the old scripts/resolve-kernel-version.sh used before this
          # session's COPR migration -- a malformed resolution should fail loudly
          # here, not get committed or silently fail to match later.
          if ! [[ "$nvr" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-z.]+\.fc[0-9]+\.[a-z0-9_]+$ ]]; then
            echo "::error::Resolved kernel-devel NVR has unexpected format: ${nvr}"
            echo "::error::Expected format: X.Y.Z-RELEASE.fcVERSION.ARCH (e.g. 7.2.9-200.fc44.x86_64)"
            exit 1
          fi
          # NOTE: this is an ADVISORY resolution only, used to decide whether a rebuild
          # is needed and to label .external_versions for history -- it does NOT get
          # baked into the actual build. kmod-yeetmouse.spec resolves kernel-devel's
          # real NVR itself, fresh, via `rpm -q` at COPR build time (see that spec's
          # own comment: "never pin an externally-resolved version string"). A brief
          # mirror-sync gap between this GH Actions container's dnf state and COPR's
          # chroot could in theory mean this check and COPR's own resolution disagree
          # for one cycle -- not a correctness risk to the build itself, just a window
          # where this poller might skip or redundantly trigger a rebuild.
          echo "nvr=${nvr}" >> "$GITHUB_OUTPUT"

      - name: Check whether a kmod-yeetmouse build already exists for this kernel
        id: existing
        run: |
          # API errors fail this step (non-zero exit), so an outage is never
          # misread as "no build exists" and never triggers a spurious rebuild.
          found=$(python3 .github/scripts/copr_build.py has-kernel-build "${{ steps.kernel.outputs.nvr }}" "${COPR_CHROOT}")
          echo "found=${found}" >> "$GITHUB_OUTPUT"
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

      - name: Record pre-push COPR build baselines
        id: baseline
        if: steps.existing.outputs.found == 'false'
        run: |
          # COPR's GitHub webhook rebuilds EVERY webhook-enabled package on any
          # push (no changed-path filtering), so this .external_versions-only
          # commit also rebuilds yeetmouse and yeetmouse-gui. Baseline and watch
          # all three, so a failure in any of them fails this run.
          # Assign first, then echo: inside `echo "x=$(cmd)"` a failing cmd is
          # masked by echo's own success, which would push with an empty baseline.
          for pkg in kmod-yeetmouse yeetmouse yeetmouse-gui; do
            id=$(python3 .github/scripts/copr_build.py latest-id "$pkg")
            echo "${pkg//-/_}=${id}" >> "$GITHUB_OUTPUT"
          done
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

      - name: Record kernel version and trigger rebuild via commit
        id: push
        if: steps.existing.outputs.found == 'false'
        run: |
          nvr="${{ steps.kernel.outputs.nvr }}"
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # KMOD_REBUILD_TRIGGERED changes on every trigger, so the commit is never
          # empty. Without it, a kernel NVR that is already recorded but has no
          # successful build (first run on a new project, or a retry after a failed
          # kmod build) produced "nothing to commit" and could never retrigger.
          # A build that keeps failing therefore retriggers every 12 hours, and each
          # attempt fails this run, which is what sends the failure email.
          sed -i -E "s/^FEDORA_KERNEL_DEVEL_NVR=.*/FEDORA_KERNEL_DEVEL_NVR=${nvr}/" .external_versions
          if grep -q '^KMOD_REBUILD_TRIGGERED=' .external_versions; then
            sed -i -E "s/^KMOD_REBUILD_TRIGGERED=.*/KMOD_REBUILD_TRIGGERED=${stamp}/" .external_versions
          else
            echo "KMOD_REBUILD_TRIGGERED=${stamp}" >> .external_versions
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .external_versions
          git commit -m "chore: trigger kmod-yeetmouse rebuild for kernel-devel ${nvr}"
          git push origin HEAD:main
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Wait for Copr webhook builds and report result
        if: steps.existing.outputs.found == 'false'
        run: |
          python3 .github/scripts/copr_build.py wait "${{ steps.push.outputs.sha }}" \
            "kmod-yeetmouse=${{ steps.baseline.outputs.kmod_yeetmouse }}" \
            "yeetmouse=${{ steps.baseline.outputs.yeetmouse }}" \
            "yeetmouse-gui=${{ steps.baseline.outputs.yeetmouse_gui }}"
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
