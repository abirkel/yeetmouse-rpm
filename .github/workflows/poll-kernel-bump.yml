name: Poll Fedora kernel version for kmod-yeetmouse

on:
  schedule:
    - cron: '30 */12 * * *'
  workflow_dispatch: {}

concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  COPR_OWNER: abirkel
  COPR_PROJECT: yeetmouse
  COPR_URL: https://copr.fedorainfracloud.org
  COPR_CHROOT: fedora-44-x86_64

jobs:
  poll:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install git and tooling
        run: dnf -y install git python3 curl findutils sed

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current stable kernel-devel NVR
        id: kernel
        run: |
          dnf -y makecache
          nvr=$(dnf repoquery --quiet --latest-limit=1 --qf '%{version}-%{release}.%{arch}' kernel-devel | tail -n1)
          if [ -z "$nvr" ]; then
            echo "::error::Could not resolve current kernel-devel NVR"
            exit 1
          fi
          # Validate format before trusting it anywhere downstream (commit message,
          # .external_versions, NVR substring match against built packages). Same
          # strict check the old scripts/resolve-kernel-version.sh used before this
          # session's COPR migration -- a malformed resolution should fail loudly
          # here, not get committed or silently fail to match later.
          if ! [[ "$nvr" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-z.]+\.fc[0-9]+\.[a-z0-9_]+$ ]]; then
            echo "::error::Resolved kernel-devel NVR has unexpected format: ${nvr}"
            echo "::error::Expected format: X.Y.Z-RELEASE.fcVERSION.ARCH (e.g. 7.2.9-200.fc44.x86_64)"
            exit 1
          fi
          # NOTE: this is an ADVISORY resolution only, used to decide whether a rebuild
          # is needed and to label .external_versions for history -- it does NOT get
          # baked into the actual build. kmod-yeetmouse.spec resolves kernel-devel's
          # real NVR itself, fresh, via `rpm -q` at COPR build time (see that spec's
          # own comment: "never pin an externally-resolved version string"). A brief
          # mirror-sync gap between this GH Actions container's dnf state and COPR's
          # chroot could in theory mean this check and COPR's own resolution disagree
          # for one cycle -- not a correctness risk to the build itself, just a window
          # where this poller might skip or redundantly trigger a rebuild.
          echo "nvr=${nvr}" >> "$GITHUB_OUTPUT"

      - name: Check whether a kmod-yeetmouse build already exists for this kernel
        id: existing
        run: |
          found=false
          page=0
          while :; do
            offset=$((page * 100))
            resp=$(curl -s --user "${COPR_LOGIN}:${COPR_TOKEN}" \
              "${COPR_URL}/api_3/build/list?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}&packagename=kmod-yeetmouse&status=succeeded&limit=100&offset=${offset}")
            count=$(echo "$resp" | python3 -c "import sys,json; print(len(json.load(sys.stdin)['items']))")
            if [ "$count" = "0" ]; then
              break
            fi
            # source_package.name/.version on the build-list response are the COPR
            # PACKAGE's own name/version (e.g. "kmod-yeetmouse" / "0"), NOT the kernel
            # version -- confirmed against Copr's real APIv3 schema (source_package has
            # only {name, version, url}). The kernel-devel NVR actually built is only
            # visible in the built RPM's own NEVRA, via the build-chroot "built packages"
            # endpoint, where the kmodtool-generated subpackage name is literally
            # "kmod-yeetmouse-<kernel-version>" (confirmed from this session's own real
            # build: kmod-yeetmouse-7.2.8-200.fc44.x86_64). Check each candidate build's
            # chroot for a built package whose name contains our target kernel NVR.
            ids=$(echo "$resp" | python3 -c "import sys,json; print(' '.join(str(i['id']) for i in json.load(sys.stdin)['items']))")
            for bid in $ids; do
              pkgs=$(curl -s --user "${COPR_LOGIN}:${COPR_TOKEN}" \
                "${COPR_URL}/api_3/build-chroot/built-packages?build_id=${bid}&chrootname=${COPR_CHROOT}")
              if echo "$pkgs" | python3 -c "
import sys, json
d = json.load(sys.stdin)
nvr = '${{ steps.kernel.outputs.nvr }}'
pkgs = d.get('packages', d) if isinstance(d, dict) else d
# response shape not fully confirmed from docs alone; handle both a bare list
# and a {chrootname: [pkgs]} dict defensively
if isinstance(pkgs, dict):
    pkgs = [p for lst in pkgs.values() for p in lst]
for p in pkgs:
    name = p.get('name', '') if isinstance(p, dict) else ''
    if nvr in name:
        sys.exit(0)
sys.exit(1)
" 2>/dev/null; then
                found=true
                break 2
              fi
            done
            page=$((page + 1))
            if [ "$page" -gt 20 ]; then
              break
            fi
          done
          echo "found=${found}" >> "$GITHUB_OUTPUT"
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

      - name: Record kernel version and trigger rebuild via commit
        if: steps.existing.outputs.found == 'false'
        run: |
          sed -i -E "s/^FEDORA_KERNEL_DEVEL_NVR=.*/FEDORA_KERNEL_DEVEL_NVR=${{ steps.kernel.outputs.nvr }}/" .external_versions || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .external_versions
          git commit -m "chore: trigger kmod-yeetmouse rebuild for kernel-devel ${{ steps.kernel.outputs.nvr }}"
          git push origin HEAD:main

      - name: Wait for Copr webhook build and report result
        if: steps.existing.outputs.found == 'false'
        run: |
          sleep 30
          build_id=$(curl -s --user "${COPR_LOGIN}:${COPR_TOKEN}" \
            "${COPR_URL}/api_3/build/list?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}&packagename=kmod-yeetmouse&limit=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['items'][0]['id'] if d['items'] else '')")
          if [ -z "$build_id" ]; then
            echo "::error::No build was triggered after push"
            exit 1
          fi
          echo "Watching kmod-yeetmouse build ${build_id}"
          for i in $(seq 1 60); do
            state=$(curl -s --user "${COPR_LOGIN}:${COPR_TOKEN}" "${COPR_URL}/api_3/build/${build_id}" | python3 -c "import sys,json; print(json.load(sys.stdin)['state'])")
            echo "  [$i] kmod-yeetmouse build ${build_id}: ${state}"
            case "$state" in
              succeeded) exit 0 ;;
              failed|canceled)
                echo "::error::kmod-yeetmouse build ${build_id} ended in state ${state}: ${COPR_URL}/coprs/build/${build_id}/"
                exit 1
                ;;
            esac
            sleep 60
          done
          echo "::error::Timed out waiting for kmod-yeetmouse build ${build_id}"
          exit 1
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
