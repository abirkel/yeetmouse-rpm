name: Poll Fedora kernels for kmod-yeetmouse

# Every 3 hours, for each ready COPR chroot (one per Fedora release, see
# copr_build.py), read the newest kernel-devel from that release's own
# Fedora container. When a kernel is newer than the kmod spec's pin for its
# release, or a ready release has no pin yet (a newly branched Fedora), move
# the pins, raise the kmod Release in the same commit, and push. Then build
# every package that is not yet published in every ready chroot.
#
# The Release bump matters because yeetmouse-kmod-common is noarch and has the
# same NEVR for every kernel. Rebuilding it at a published version-release
# would publish a duplicate NEVR, and COPR drops a NEVR entirely when the
# newest of its duplicate builds is deleted.
#
# COPR's buildroot can lag Fedora's mirrors. The kmod spec then fails the
# build before producing any package, so this run retries the same
# version-release every 3 hours, with no further bump. A package still
# unpublished 24 hours after its spec last changed fails the run (and sends
# the email). So does a chroot that is not ready.

on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch: {}

# Shared by every workflow that pushes to main or submits COPR builds.
concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  COPR_OWNER: abirkel
  COPR_PROJECT: yeetmouse
  COPR_URL: https://copr.fedorainfracloud.org

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A scheduled run's github.sha is fixed when the run is queued, and
          # this run can wait behind another one in the group. Read live main.
          ref: main
          fetch-depth: 0

      - name: Find the ready COPR chroots
        id: chroots
        run: |
          ready=$(python3 .github/scripts/copr_build.py ready-chroots)
          echo "Ready chroots: ${ready:-none}"
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Read each release's newest kernel-devel
        id: kernels
        if: steps.chroots.outputs.ready != ''
        env:
          READY: ${{ steps.chroots.outputs.ready }}
        run: |
          pins=$(bash .github/scripts/sense_kernels.sh "$READY")
          echo "pins=${pins}" >> "$GITHUB_OUTPUT"

      - name: Move the kernel pins and raise the kmod Release, commit and push
        if: steps.chroots.outputs.ready != ''
        env:
          KERNEL_PINS: ${{ steps.kernels.outputs.pins }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/pin_kernels.sh

      - name: Build every package that is unpublished in a ready chroot
        if: steps.chroots.outputs.ready != ''
        env:
          READY: ${{ steps.chroots.outputs.ready }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          pairs=$(python3 .github/scripts/spec_version.py evrs)
          # shellcheck disable=SC2086  # pairs is space-separated on purpose
          python3 .github/scripts/copr_build.py ensure-built --grace-hours 24 "$READY" $pairs

      - name: Fail if a COPR chroot is not ready
        if: always()
        run: python3 .github/scripts/copr_build.py check-chroots
