name: Poll YeetMouse upstream commit

# When upstream YeetMouse has a new commit, set the new snapshot version in
# all three specs on main (Release back to 1), refresh the kmod spec's kernel
# pins in the same commit, then build all three in every ready COPR chroot
# through COPR's API. Every run also builds any package that is not yet
# published in a ready chroot, so a build that failed last time is retried
# here without anything having to change.
#
# A new commit whose committer date is not later than the current pin's (same
# day, or an upstream force-push) is refused and fails the run. See BUILDING.md,
# "Same-day upstream commits".

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

# Shared by every workflow that pushes to main or submits COPR builds.
concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: AndyFilter/YeetMouse
  COPR_OWNER: abirkel
  COPR_PROJECT: yeetmouse
  COPR_URL: https://copr.fedorainfracloud.org

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A scheduled run's github.sha is fixed when the run is queued, and
          # this run can wait behind another one in the group. Read live main.
          ref: main
          fetch-depth: 0

      - name: Get latest upstream commit and its date
        id: upstream
        run: |
          sha=$(gh api "repos/${UPSTREAM_REPO}/commits/master" --jq '.sha')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected upstream sha: ${sha}"
            exit 1
          fi
          date=$(gh api "repos/${UPSTREAM_REPO}/commits/${sha}" --jq '.commit.committer.date')
          # Fedora snapshot date: the upstream committer date, UTC, YYYYMMDD.
          # It orders snapshots, so validate it strictly.
          snapdate=$(date -u -d "$date" +%Y%m%d)
          if ! [[ "$snapdate" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Could not format upstream commit date: ${date}"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "snapdate=${snapdate}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find the ready COPR chroots
        id: chroots
        run: |
          ready=$(python3 .github/scripts/copr_build.py ready-chroots)
          echo "Ready chroots: ${ready:-none}"
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Read each release's newest kernel-devel
        id: kernels
        if: steps.chroots.outputs.ready != ''
        env:
          READY: ${{ steps.chroots.outputs.ready }}
        run: |
          pins=$(bash .github/scripts/sense_kernels.sh "$READY")
          echo "pins=${pins}" >> "$GITHUB_OUTPUT"

      - name: Pin the new snapshot, commit and push
        env:
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          SNAPDATE: ${{ steps.upstream.outputs.snapdate }}
          KERNEL_PINS: ${{ steps.kernels.outputs.pins }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/pin_upstream.sh

      - name: Build every package that is unpublished in a ready chroot
        if: steps.chroots.outputs.ready != ''
        env:
          READY: ${{ steps.chroots.outputs.ready }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          pairs=$(python3 .github/scripts/spec_version.py evrs)
          # shellcheck disable=SC2086  # pairs is space-separated on purpose
          python3 .github/scripts/copr_build.py ensure-built --grace-hours 24 "$READY" $pairs

      - name: Fail if a COPR chroot is not ready
        if: always()
        run: python3 .github/scripts/copr_build.py check-chroots
