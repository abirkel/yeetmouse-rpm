name: Poll YeetMouse upstream commit

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: AndyFilter/YeetMouse
  COPR_OWNER: abirkel
  COPR_PROJECT: yeetmouse
  COPR_URL: https://copr.fedorainfracloud.org

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest upstream commit
        id: upstream
        run: |
          sha=$(gh api repos/${UPSTREAM_REPO}/commits/master --jq '.sha')
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get currently tracked commit
        id: current
        run: |
          current=$(grep -oP '^YEETMOUSE_COMMIT=\K.*' .external_versions)
          echo "sha=${current}" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.current.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update spec commit pins and .external_versions
        if: steps.compare.outputs.changed == 'true'
        run: |
          new_sha="${{ steps.upstream.outputs.sha }}"
          short_sha="${new_sha:0:7}"
          for f in specs/kmod-yeetmouse.spec specs/yeetmouse.spec specs/yeetmouse-gui.spec; do
            sed -i -E "s/(%global commit %\{\?commit\}%\{!\?commit:)[0-9a-f]+(\})/\1${new_sha}\2/" "$f" || true
            sed -i -E "s/(%global shortcommit %\{\?shortcommit\}%\{!\?shortcommit:)[0-9a-f]+(\})/\1${short_sha}\2/" "$f" || true
            sed -i -E "s/^%global commit [0-9a-f]+$/%global commit ${new_sha}/" "$f" || true
            sed -i -E "s/^%global shortcommit [0-9a-f]+$/%global shortcommit ${short_sha}/" "$f" || true
          done
          sed -i -E "s/^YEETMOUSE_COMMIT=.*/YEETMOUSE_COMMIT=${new_sha}/" .external_versions

      - name: Record pre-push COPR build baselines
        id: baseline
        if: steps.compare.outputs.changed == 'true'
        run: |
          # Newest existing build id per package, taken BEFORE pushing, so the
          # watcher can only ever pick up a build the webhook queued for our push.
          for pkg in kmod-yeetmouse yeetmouse yeetmouse-gui; do
            id=$(python3 .github/scripts/copr_build.py latest-id "$pkg")
            echo "${pkg//-/_}=${id}" >> "$GITHUB_OUTPUT"
          done
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

      - name: Commit and push
        id: push
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add specs/kmod-yeetmouse.spec specs/yeetmouse.spec specs/yeetmouse-gui.spec .external_versions
          git commit -m "chore: update yeetmouse commit pin to ${{ steps.upstream.outputs.sha }}"
          git push origin HEAD:main
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Wait for Copr webhook builds and report result
        if: steps.compare.outputs.changed == 'true'
        run: |
          # One shared deadline for all three packages; every package is reported
          # before the step fails. Builds are matched to this push's commit SHA.
          python3 .github/scripts/copr_build.py wait "${{ steps.push.outputs.sha }}" \
            "kmod-yeetmouse=${{ steps.baseline.outputs.kmod_yeetmouse }}" \
            "yeetmouse=${{ steps.baseline.outputs.yeetmouse }}" \
            "yeetmouse-gui=${{ steps.baseline.outputs.yeetmouse_gui }}"
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
