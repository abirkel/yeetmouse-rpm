name: Poll YeetMouse upstream commit

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: AndyFilter/YeetMouse
  COPR_OWNER: abirkel
  COPR_PROJECT: yeetmouse
  COPR_URL: https://copr.fedorainfracloud.org

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest upstream commit
        id: upstream
        run: |
          sha=$(gh api repos/${UPSTREAM_REPO}/commits/master --jq '.sha')
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get currently tracked commit
        id: current
        run: |
          current=$(grep -oP '^YEETMOUSE_COMMIT=\K.*' .external_versions)
          echo "sha=${current}" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.current.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update spec commit pins and .external_versions
        if: steps.compare.outputs.changed == 'true'
        run: |
          new_sha="${{ steps.upstream.outputs.sha }}"
          short_sha="${new_sha:0:7}"
          for f in specs/kmod-yeetmouse.spec specs/yeetmouse.spec specs/yeetmouse-gui.spec; do
            sed -i -E "s/(%global commit %\{\?commit\}%\{!\?commit:)[0-9a-f]+(\})/\1${new_sha}\2/" "$f" || true
            sed -i -E "s/(%global shortcommit %\{\?shortcommit\}%\{!\?shortcommit:)[0-9a-f]+(\})/\1${short_sha}\2/" "$f" || true
            sed -i -E "s/^%global commit [0-9a-f]+$/%global commit ${new_sha}/" "$f" || true
            sed -i -E "s/^%global shortcommit [0-9a-f]+$/%global shortcommit ${short_sha}/" "$f" || true
          done
          sed -i -E "s/^YEETMOUSE_COMMIT=.*/YEETMOUSE_COMMIT=${new_sha}/" .external_versions

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add specs/kmod-yeetmouse.spec specs/yeetmouse.spec specs/yeetmouse-gui.spec .external_versions
          git commit -m "chore: update yeetmouse commit pin to ${{ steps.upstream.outputs.sha }}"
          git push origin HEAD:main

      - name: Wait for Copr webhook build and report result
        if: steps.compare.outputs.changed == 'true'
        run: |
          sleep 30
          for pkg in kmod-yeetmouse yeetmouse yeetmouse-gui; do
            build_id=$(curl -s --user "${COPR_LOGIN}:${COPR_TOKEN}" \
              "${COPR_URL}/api_3/build/list?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}&packagename=${pkg}&limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['items'][0]['id'] if d['items'] else '')")
            if [ -z "$build_id" ]; then
              echo "::warning::No build found yet for ${pkg}, skipping wait"
              continue
            fi
            echo "Watching ${pkg} build ${build_id}"
            for i in $(seq 1 60); do
              state=$(curl -s --user "${COPR_LOGIN}:${COPR_TOKEN}" "${COPR_URL}/api_3/build/${build_id}" | python3 -c "import sys,json; print(json.load(sys.stdin)['state'])")
              echo "  [$i] ${pkg} build ${build_id}: ${state}"
              case "$state" in
                succeeded) break ;;
                failed|canceled)
                  echo "::error::${pkg} build ${build_id} ended in state ${state}: ${COPR_URL}/coprs/build/${build_id}/"
                  exit 1
                  ;;
              esac
              sleep 60
            done
          done
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
