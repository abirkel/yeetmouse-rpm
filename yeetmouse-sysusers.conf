# yeetmouse.service chowns /sys/module/yeetmouse/parameters/* to this group, so the
# acceleration curve can be retuned without root. The unit fails outright without it:
#   chown: invalid group: 'root:yeetmouse'
#
# Declared here rather than in a %pre groupadd so it also works on rpm-ostree/atomic
# systems, where systemd-sysusers reprocesses /usr/lib/sysusers.d on every boot and
# install-time scriptlet changes to /etc are not carried in the image.
#
# No GID pin: nothing outside this package references the group by number.
#Type Name      ID
g     yeetmouse -
